<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- ========================================
         META & SEO
    ========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <meta name="description" content="Niche CRM — Enterprise Agency Operating System. Plateforme de gestion complète pour agences et entreprises.">
    <meta name="keywords" content="CRM, Agency OS, Pipeline, Projects, Finance, Analytics, SaaS">
    <meta name="author" content="Niche CRM">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Niche CRM — Enterprise Agency OS">
    <meta property="og:description" content="Plateforme de gestion complète pour agences et entreprises">
    <meta property="og:type" content="website">
    <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2364ffda'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%230a192f' font-weight='bold' font-family='Arial'%3ENC%3C/text%3E%3C/svg%3E">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2364ffda'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%230a192f' font-weight='bold' font-family='Arial'%3ENC%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2364ffda'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%230a192f' font-weight='bold' font-family='Arial'%3ENC%3C/text%3E%3C/svg%3E">
    
    <title>Niche CRM — Enterprise Agency OS</title>
    
    <!-- ========================================
         PREMIUM FONTS
    ========================================== -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
             RESET & BASE
        ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ========================================
             THEME ENGINE — ROOT VARIABLES
        ========================================== */
        :root {
            /* Dark Blue Enterprise Theme */
            --bg-deep: #0a0c15;
            --bg-primary: #0f111a;
            --bg-secondary: #151821;
            --bg-tertiary: #1a1d2b;
            --bg-card: #1e2130;
            --bg-card-hover: #252a3d;
            --bg-sidebar: #0a0c15;
            --bg-header: rgba(15, 17, 26, 0.85);
            
            /* Borders */
            --border-light: rgba(42, 47, 69, 0.4);
            --border-medium: #2a2f45;
            --border-heavy: #353b55;
            
            /* Accent Colors — Futuristic Cyan/Green */
            --accent-primary: #64ffda;
            --accent-secondary: #00d2b8;
            --accent-glow: rgba(100, 255, 218, 0.08);
            --accent-gradient: linear-gradient(135deg, #64ffda, #00b4d8);
            --accent-gradient-glow: linear-gradient(135deg, rgba(100, 255, 218, 0.2), rgba(0, 180, 216, 0.2));
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --purple: #8b5cf6;
            
            /* Text Colors */
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --text-disabled: #475569;
            
            /* Shadows & Effects */
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(100, 255, 218, 0.15);
            --shadow-glow-strong: 0 0 40px rgba(100, 255, 218, 0.25);
            
            /* Glassmorphism */
            --glass-bg: rgba(26, 29, 43, 0.7);
            --glass-border: rgba(100, 255, 218, 0.1);
            
            /* Layout Dimensions */
            --sidebar-width: 280px;
            --sidebar-collapsed: 88px;
            --header-height: 70px;
            
            /* Animation */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Border Radius */
            --radius-xs: 4px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 28px;
        }
        
        /* ========================================
             GLOBAL STYLES
        ========================================== */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Typography Hierarchy */
        h1, h2, h3, h4, h5, h6, .heading, .logo-text {
            font-family: 'Space Grotesk', monospace;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        /* Custom Scrollbar — Premium */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-heavy);
            border-radius: 10px;
            transition: background var(--transition-fast);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
        
        /* Selection Color */
        ::selection {
            background: var(--accent-primary);
            color: var(--bg-deep);
        }
        
        /* ========================================
             LOADING SCREEN — PREMIUM
        ========================================== */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }
        
        #loading-screen.hide {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-container {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loading-logo {
            width: 100px;
            height: 100px;
            background: var(--accent-gradient);
            border-radius: var(--radius-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: logoPulse 2s ease-in-out infinite;
            box-shadow: var(--shadow-glow);
        }
        
        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(100, 255, 218, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(100, 255, 218, 0);
            }
        }
        
        .loading-logo span {
            font-size: 42px;
            font-weight: 700;
            color: var(--bg-deep);
            font-family: 'Space Grotesk', monospace;
        }
        
        .loading-title {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        
        .loading-sub {
            font-size: 13px;
            color: var(--text-tertiary);
            letter-spacing: 1px;
            margin-bottom: 32px;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-medium);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-progress {
            width: 280px;
            height: 3px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .loading-progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 4px;
            transition: width 0.3s ease-out;
        }
        
        .loading-status {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 16px;
            font-family: monospace;
        }
        
        /* ========================================
             APP ROOT CONTAINER
        ========================================== */
        #root {
            min-height: 100vh;
            display: flex;
            position: relative;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }
        
        #root.loaded {
            opacity: 1;
        }
        
        /* ========================================
             SIDEBAR — MODERN ENTERPRISE
        ========================================== */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--bg-sidebar) 0%, var(--bg-primary) 100%);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: width var(--transition-normal);
            backdrop-filter: blur(20px);
        }
        
        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }
        
        /* Sidebar Header */
        .sidebar-header {
            padding: 28px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar-logo {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        
        .sidebar-logo span {
            font-size: 20px;
            font-weight: 700;
            color: var(--bg-deep);
        }
        
        .sidebar-logo-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .sidebar-logo-version {
            font-size: 9px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        
        /* Navigation */
        .sidebar-nav {
            flex: 1;
            padding: 24px 12px;
            overflow-y: auto;
        }
        
        .nav-section {
            margin-bottom: 28px;
        }
        
        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
            padding: 0 14px 10px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }
        
        .nav-item:hover {
            background: var(--accent-glow);
            color: var(--accent-primary);
            transform: translateX(4px);
        }
        
        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent-primary);
        }
        
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            width: 3px;
            height: 28px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 8px var(--accent-primary);
        }
        
        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        .nav-label {
            font-size: 13px;
            font-weight: 500;
            flex: 1;
        }
        
        .nav-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        /* Sidebar Footer / User Profile */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            color: var(--bg-deep);
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-size: 13px;
            font-weight: 600;
        }
        
        .user-role {
            font-size: 10px;
            color: var(--text-tertiary);
        }
        
        .logout-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .logout-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        
        /* ========================================
             MAIN CONTENT AREA
        ========================================== */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: margin-left var(--transition-normal);
        }
        
        .sidebar.collapsed ~ .main-content {
            margin-left: var(--sidebar-collapsed);
        }
        
        /* Header — Premium Glassmorphism */
        .app-header {
            height: var(--header-height);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 90;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .menu-toggle {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .menu-toggle:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: scale(1.02);
        }
        
        .breadcrumb {
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        .breadcrumb strong {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        /* Search Bar */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 8px 16px;
            width: 280px;
            transition: all var(--transition-fast);
        }
        
        .search-bar:focus-within {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
        }
        
        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }
        
        .search-bar input::placeholder {
            color: var(--text-tertiary);
        }
        
        .search-kbd {
            font-size: 11px;
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-tertiary);
            font-family: monospace;
        }
        
        /* Header Actions */
        .header-action {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }
        
        .header-action:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .notification-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--danger);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }
        
        /* Page Container */
        .page-container {
            padding: 28px 32px;
            min-height: calc(100vh - var(--header-height));
        }
        
        /* ========================================
             NOTIFICATION SYSTEM
        ========================================== */
        .notification-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .notification {
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-width: 300px;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.3s var(--transition-normal);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .notification:hover {
            transform: translateX(-4px);
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .notification-message {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        
        .notification-close {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-tertiary);
            transition: color var(--transition-fast);
        }
        
        .notification-close:hover {
            color: var(--text-primary);
        }
        
        /* Notification Types */
        .notification.success { border-left: 3px solid var(--success); }
        .notification.warning { border-left: 3px solid var(--warning); }
        .notification.error { border-left: 3px solid var(--danger); }
        .notification.info { border-left: 3px solid var(--accent-primary); }
        
        /* ========================================
             RESPONSIVE DESIGN
        ========================================== */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform var(--transition-normal);
                z-index: 200;
            }
            
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(10, 12, 21, 0.8);
                backdrop-filter: blur(4px);
                z-index: 150;
                display: none;
            }
            
            .sidebar-overlay.active {
                display: block;
            }
            
            .main-content {
                margin-left: 0 !important;
            }
            
            .search-bar {
                display: none;
            }
            
            .page-container {
                padding: 20px;
            }
        }
        
        @media (max-width: 640px) {
            .app-header {
                padding: 0 16px;
            }
            
            .breadcrumb {
                display: none;
            }
            
            .header-action {
                width: 36px;
                height: 36px;
            }
        }
        
        /* ========================================
             UTILITY CLASSES
        ========================================== */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
        }
        
        .hover-glow:hover {
            box-shadow: var(--shadow-glow);
            border-color: var(--accent-primary);
        }
        
        .transition-all {
            transition: all var(--transition-normal);
        }
        
        /* Loading Spinner Utility */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-medium);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- ========================================
         PREMIUM LOADING SCREEN
    ========================================== -->
    <div id="loading-screen">
        <div class="loading-container">
            <div class="loading-logo">
                <span>NC</span>
            </div>
            <div class="loading-title">Niche CRM</div>
            <div class="loading-sub">ENTERPRISE AGENCY OS</div>
            <div class="loading-spinner"></div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loading-progress-bar"></div>
            </div>
            <div class="loading-status" id="loading-status">Initialisation...</div>
        </div>
    </div>

    <!-- ========================================
         NOTIFICATION CONTAINER
    ========================================== -->
    <div id="notification-container" class="notification-container"></div>

    <!-- ========================================
         APP ROOT — DYNAMIC CONTENT
    ========================================== -->
    <div id="root"></div>

    <!-- ========================================
         MOBILE SIDEBAR OVERLAY
    ========================================== -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script>
        // ========================================
        // APP CORE — STATE MANAGEMENT
        // ========================================
        
        const AppCore = {
            // State
            state: {
                currentRoute: '/dashboard',
                isSidebarCollapsed: false,
                isMobileMenuOpen: false,
                isLoading: true,
                user: null,
                notifications: [],
                modules: {}
            },
            
            // Routes Configuration
            routes: {
                '/dashboard': { title: 'Tableau de bord', icon: '📊', module: 'dashboard', permissions: ['admin', 'manager', 'viewer'] },
                '/people': { title: 'Personnes', icon: '👥', module: 'people', permissions: ['admin', 'manager'] },
                '/pipeline': { title: 'Pipeline', icon: '⟶', module: 'pipeline', permissions: ['admin', 'manager', 'viewer'] },
                '/projects': { title: 'Projets', icon: '📁', module: 'projects', permissions: ['admin', 'manager', 'viewer'] },
                '/finance': { title: 'Finance', icon: '💰', module: 'finance', permissions: ['admin', 'manager'] },
                '/analytics': { title: 'Analytique', icon: '📈', module: 'analytics', permissions: ['admin', 'manager'] },
                '/client-portal': { title: 'Portail client', icon: '🌐', module: 'client-portal', permissions: ['admin', 'client'] },
                '/settings': { title: 'Paramètres', icon: '⚙️', module: 'settings', permissions: ['admin'] }
            },
            
            // Navigation Items
            navigationItems: [
                { section: 'PRINCIPAL', items: ['/dashboard', '/people', '/pipeline', '/projects', '/analytics'] },
                { section: 'CLIENT', items: ['/client-portal', '/finance'] },
                { section: 'SYSTÈME', items: ['/settings'] }
            ],
            
            // User Session
            session: null,
            
            // ========================================
            // INITIALIZATION
            // ========================================
            async init() {
                // Load session
                this.loadSession();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Start loading animation
                this.simulateLoading();
                
                // Render initial UI
                await this.render();
                
                // Handle initial route
                this.handleRoute();
                
                // Setup hash change listener
                window.addEventListener('hashchange', () => this.handleRoute());
                
                // Setup resize listener for responsive
                window.addEventListener('resize', () => this.handleResize());
            },
            
            // ========================================
            // SESSION MANAGEMENT
            // ========================================
            loadSession() {
                const savedSession = localStorage.getItem('crm_session');
                if (savedSession) {
                    try {
                        this.session = JSON.parse(savedSession);
                    } catch(e) {
                        console.error('Invalid session');
                    }
                }
                
                // Demo session if none exists
                if (!this.session) {
                    this.session = {
                        id: 'admin_1',
                        name: 'Administrateur',
                        email: 'admin@niche-crm.com',
                        role: 'admin',
                        roleLabel: 'Super Administrateur',
                        avatar: 'AD',
                        permissions: ['admin', 'manager', 'viewer']
                    };
                    localStorage.setItem('crm_session', JSON.stringify(this.session));
                }
            },
            
            // ========================================
            // LOADING SIMULATION
            // ========================================
            simulateLoading() {
                let progress = 0;
                const statusMessages = [
                    'Chargement du noyau...',
                    'Initialisation des modules...',
                    'Connexion à la base...',
                    'Préparation de l\'interface...',
                    'Finalisation...'
                ];
                let msgIndex = 0;
                
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        const loadingScreen = document.getElementById('loading-screen');
                        const root = document.getElementById('root');
                        
                        loadingScreen.classList.add('hide');
                        root.classList.add('loaded');
                        
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 600);
                        
                        // Show welcome notification
                        this.showNotification('Bienvenue sur Niche CRM — Enterprise Agency OS', 'success');
                    }
                    
                    const progressBar = document.getElementById('loading-progress-bar');
                    if (progressBar) {
                        progressBar.style.width = Math.min(progress, 100) + '%';
                    }
                    
                    if (progress > (msgIndex + 1) * 20 && msgIndex < statusMessages.length - 1) {
                        msgIndex++;
                        const statusEl = document.getElementById('loading-status');
                        if (statusEl) statusEl.textContent = statusMessages[msgIndex];
                    }
                }, 250);
            },
            
            // ========================================
            // NOTIFICATION SYSTEM
            // ========================================
            showNotification(message, type = 'info', title = null) {
                const container = document.getElementById('notification-container');
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                
                const icons = {
                    success: '✅',
                    warning: '⚠️',
                    error: '❌',
                    info: 'ℹ️'
                };
                
                const titles = {
                    success: 'Succès',
                    warning: 'Attention',
                    error: 'Erreur',
                    info: 'Information'
                };
                
                notification.innerHTML = `
                    <div class="notification-icon">${icons[type] || 'ℹ️'}</div>
                    <div class="notification-content">
                        <div class="notification-title">${title || titles[type]}</div>
                        <div class="notification-message">${message}</div>
                    </div>
                    <div class="notification-close" onclick="this.parentElement.remove()">✕</div>
                `;
                
                container.appendChild(notification);
                
                // Auto remove after 5 seconds
                setTimeout(() => {
                    if (notification.parentElement) notification.remove();
                }, 5000);
                
                return notification;
            },
            
            // ========================================
            // RENDER UI
            // ========================================
            async render() {
                const root = document.getElementById('root');
                if (!root) return;
                
                // Build sidebar HTML
                const sidebarHtml = this.buildSidebar();
                const headerHtml = this.buildHeader();
                
                root.innerHTML = `
                    ${sidebarHtml}
                    <main class="main-content">
                        ${headerHtml}
                        <div class="page-container" id="page-container">
                            <div class="spinner" style="margin: 100px auto;"></div>
                        </div>
                    </main>
                `;
                
                // Setup sidebar toggle
                const menuToggle = document.getElementById('menu-toggle');
                if (menuToggle) {
                    menuToggle.addEventListener('click', () => this.toggleSidebar());
                }
                
                // Setup search
                const searchInput = document.getElementById('global-search');
                if (searchInput) {
                    searchInput.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                            e.preventDefault();
                            this.showNotification('Recherche globale — Fonctionnalité à venir', 'info');
                        }
                    });
                }
                
                // Setup notification bell
                const notifBtn = document.getElementById('notifications-btn');
                if (notifBtn) {
                    notifBtn.addEventListener('click', () => {
                        this.showNotification('3 nouvelles notifications non lues', 'info', 'Notifications');
                    });
                }
            },
            
            // ========================================
            // BUILD SIDEBAR
            // ========================================
            buildSidebar() {
                const currentPath = window.location.hash.slice(1) || '/dashboard';
                const isCollapsed = this.state.isSidebarCollapsed;
                
                let sidebarHtml = `
                    <aside class="sidebar ${isCollapsed ? 'collapsed' : ''}" id="sidebar">
                        <div class="sidebar-header">
                            <div class="sidebar-logo">
                                <span>NC</span>
                            </div>
                            ${!isCollapsed ? `
                                <div>
                                    <div class="sidebar-logo-text">Niche CRM</div>
                                    <div class="sidebar-logo-version">Enterprise OS v2.0</div>
                                </div>
                            ` : ''}
                        </div>
                        <nav class="sidebar-nav">
                `;
                
                for (const section of this.navigationItems) {
                    sidebarHtml += `
                        <div class="nav-section">
                            ${!isCollapsed ? `<div class="nav-section-title">${section.section}</div>` : ''}
                    `;
                    
                    for (const path of section.items) {
                        const route = this.routes[path];
                        if (!route) continue;
                        
                        const isActive = currentPath === path;
                        sidebarHtml += `
                            <a href="#${path}" class="nav-item ${isActive ? 'active' : ''}">
                                <span class="nav-icon">${route.icon}</span>
                                ${!isCollapsed ? `<span class="nav-label">${route.title}</span>` : ''}
                            </a>
                        `;
                    }
                    
                    sidebarHtml += `</div>`;
                }
                
                sidebarHtml += `
                        </nav>
                        <div class="sidebar-footer">
                            <div class="user-avatar">${this.session.avatar || this.session.name?.charAt(0) || 'U'}</div>
                            ${!isCollapsed ? `
                                <div class="user-info">
                                    <div class="user-name">${this.session.name}</div>
                                    <div class="user-role">${this.session.roleLabel}</div>
                                </div>
                                <div class="logout-btn" onclick="AppCore.logout()">🚪</div>
                            ` : ''}
                        </div>
                    </aside>
                `;
                
                return sidebarHtml;
            },
            
            // ========================================
            // BUILD HEADER
            // ========================================
            buildHeader() {
                const currentPath = window.location.hash.slice(1) || '/dashboard';
                const currentRoute = this.routes[currentPath] || this.routes['/dashboard'];
                
                return `
                    <header class="app-header">
                        <div class="header-left">
                            <div class="menu-toggle" id="menu-toggle">
                                <span>☰</span>
                            </div>
                            <div class="breadcrumb">
                                Navigation / <strong>${currentRoute.title}</strong>
                            </div>
                        </div>
                        <div class="header-right">
                            <div class="search-bar">
                                <span>🔍</span>
                                <input type="text" id="global-search" placeholder="Rechercher...">
                                <span class="search-kbd">⌘K</span>
                            </div>
                            <div class="header-action" id="notifications-btn">
                                <span>🔔</span>
                                <span class="notification-dot"></span>
                            </div>
                        </div>
                    </header>
                `;
            },
            
            // ========================================
            // ROUTE HANDLER
            // ========================================
            async handleRoute() {
                const hash = window.location.hash.slice(1) || '/dashboard';
                const route = this.routes[hash] || this.routes['/dashboard'];
                const container = document.getElementById('page-container');
                
                if (!container) return;
                
                // Update breadcrumb
                const breadcrumb = document.querySelector('.breadcrumb strong');
                if (breadcrumb) breadcrumb.textContent = route.title;
                
                // Update active nav item
                document.querySelectorAll('.nav-item').forEach(item => {
                    const href = item.getAttribute('href');
                    if (href === `#${hash}`) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
                
                // Show loading in page container
                container.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 400px;">
                        <div class="spinner"></div>
                    </div>
                `;
                
                // Simulate module loading
                setTimeout(() => {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 80px 20px;">
                            <div style="font-size: 64px; margin-bottom: 24px;">${route.icon}</div>
                            <div style="font-size: 28px; font-weight: 700; margin-bottom: 12px; font-family: 'Space Grotesk';">${route.title}</div>
                            <div style="color: var(--text-tertiary); margin-bottom: 24px;">Module en cours de développement</div>
                            <div class="glass-card" style="max-width: 500px; margin: 0 auto; padding: 24px;">
                                <div style="font-size: 14px; color: var(--text-secondary);">
                                    Ce module sera bientôt disponible avec toutes les fonctionnalités dynamiques.
                                </div>
                            </div>
                        </div>
                    `;
                }, 500);
            },
            
            // ========================================
            // SIDEBAR TOGGLE
            // ========================================
            toggleSidebar() {
                this.state.isSidebarCollapsed = !this.state.isSidebarCollapsed;
                const sidebar = document.getElementById('sidebar');
                if (sidebar) {
                    sidebar.classList.toggle('collapsed', this.state.isSidebarCollapsed);
                }
                localStorage.setItem('sidebar_collapsed', this.state.isSidebarCollapsed);
            },
            
            // ========================================
            // RESPONSIVE HANDLER
            // ========================================
            handleResize() {
                if (window.innerWidth > 1024) {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('sidebar-overlay');
                    if (sidebar) sidebar.classList.remove('mobile-open');
                    if (overlay) overlay.classList.remove('active');
                    this.state.isMobileMenuOpen = false;
                }
            },
            
            // ========================================
            // LOGOUT
            // ========================================
            logout() {
                localStorage.removeItem('crm_session');
                this.showNotification('Déconnexion réussie', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            },
            
            // ========================================
            // MOBILE SIDEBAR TOGGLE
            // ========================================
            toggleMobileSidebar() {
                this.state.isMobileMenuOpen = !this.state.isMobileMenuOpen;
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                
                if (sidebar) sidebar.classList.toggle('mobile-open', this.state.isMobileMenuOpen);
                if (overlay) overlay.classList.toggle('active', this.state.isMobileMenuOpen);
            }
        };
        
        // Expose AppCore globally
        window.AppCore = AppCore;
        
        // Start the application
        AppCore.init();
    </script>
</body>
</html>
