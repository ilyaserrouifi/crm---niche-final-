<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a192f">
    <title>Niche CRM — Enterprise Agency OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========================================
             THEME ENGINE
        ========================================== */
        :root {
            --bg-deep: #0a0c15;
            --bg-primary: #0f111a;
            --bg-secondary: #151821;
            --bg-tertiary: #1a1d2b;
            --bg-card: #1e2130;
            --bg-card-hover: #252a3d;
            --bg-sidebar: #0a0c15;
            --bg-header: rgba(15, 17, 26, 0.85);
            --border-light: rgba(42, 47, 69, 0.4);
            --border-medium: #2a2f45;
            --accent-primary: #64ffda;
            --accent-secondary: #00b4d8;
            --accent-glow: rgba(100, 255, 218, 0.08);
            --accent-gradient: linear-gradient(135deg, #64ffda, #00b4d8);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --glass-bg: rgba(26, 29, 43, 0.7);
            --glass-border: rgba(100, 255, 218, 0.1);
            --sidebar-width: 280px;
            --sidebar-collapsed: 88px;
            --header-height: 70px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 28px;
            --shadow-glow: 0 0 30px rgba(100, 255, 218, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        h1, h2, h3, .logo-text { font-family: 'Space Grotesk', monospace; font-weight: 600; letter-spacing: -0.02em; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-tertiary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.6s, visibility 0.6s;
        }
        #loading-screen.hide { opacity: 0; visibility: hidden; }
        .loading-container { text-align: center; animation: fadeInUp 0.8s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .loading-logo {
            width: 100px; height: 100px;
            background: var(--accent-gradient);
            border-radius: var(--radius-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: logoPulse 2s infinite;
            box-shadow: var(--shadow-glow);
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(100,255,218,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(100,255,218,0); }
        }
        .loading-logo span { font-size: 42px; font-weight: 700; color: var(--bg-deep); font-family: 'Space Grotesk', monospace; }
        .loading-title { font-size: 24px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
        .loading-sub { font-size: 12px; color: var(--text-tertiary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
        .loading-spinner { width: 48px; height: 48px; border: 3px solid var(--border-medium); border-top-color: var(--accent-primary); border-radius: 50%; margin: 0 auto 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-progress { width: 280px; height: 3px; background: var(--bg-tertiary); border-radius: 4px; margin: 0 auto; overflow: hidden; }
        .loading-progress-bar { width: 0%; height: 100%; background: var(--accent-gradient); transition: width 0.3s; }
        .loading-status { font-size: 12px; color: var(--text-tertiary); margin-top: 16px; font-family: monospace; }
        
        /* App Root */
        #root { min-height: 100vh; display: flex; opacity: 0; transition: opacity var(--transition-normal); }
        #root.loaded { opacity: 1; }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--bg-sidebar) 0%, var(--bg-primary) 100%);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 100;
            transition: width var(--transition-normal);
            backdrop-filter: blur(20px);
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed); }
        .sidebar-header { padding: 28px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px; }
        .sidebar-logo { width: 44px; height: 44px; background: var(--accent-gradient); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar-logo span { font-size: 20px; font-weight: 700; color: var(--bg-deep); }
        .sidebar-logo-text { font-size: 16px; font-weight: 700; }
        .sidebar-logo-version { font-size: 9px; color: var(--text-tertiary); margin-top: 2px; }
        .sidebar-nav { flex: 1; padding: 24px 12px; overflow-y: auto; }
        .nav-section { margin-bottom: 28px; }
        .nav-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-tertiary); padding: 0 14px 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 14px; margin: 2px 0;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }
        .nav-item:hover { background: var(--accent-glow); color: var(--accent-primary); transform: translateX(4px); }
        .nav-item.active { background: var(--accent-glow); color: var(--accent-primary); }
        .nav-item.active::before { content: ''; position: absolute; left: 0; width: 3px; height: 28px; background: var(--accent-primary); border-radius: 0 4px 4px 0; box-shadow: 0 0 8px var(--accent-primary); }
        .nav-icon { font-size: 18px; width: 24px; text-align: center; }
        .nav-label { font-size: 13px; font-weight: 500; flex: 1; }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; background: var(--accent-gradient); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--bg-deep); }
        .user-info { flex: 1; }
        .user-name { font-size: 13px; font-weight: 600; }
        .user-role { font-size: 10px; color: var(--text-tertiary); }
        .logout-btn { width: 32px; height: 32px; background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-fast); }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger); }
        
        /* Main Content */
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; transition: margin-left var(--transition-normal); }
        .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed); }
        .app-header {
            height: var(--header-height);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 90;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .menu-toggle { width: 40px; height: 40px; background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .menu-toggle:hover { border-color: var(--accent-primary); color: var(--accent-primary); transform: scale(1.02); }
        .breadcrumb { font-size: 13px; color: var(--text-tertiary); }
        .breadcrumb strong { color: var(--text-primary); font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 8px 16px;
            width: 280px;
        }
        .search-bar:focus-within { border-color: var(--accent-primary); box-shadow: var(--shadow-glow); }
        .search-bar input { background: none; border: none; outline: none; color: var(--text-primary); font-size: 13px; width: 100%; }
        .search-bar input::placeholder { color: var(--text-tertiary); }
        .search-kbd { font-size: 11px; background: var(--bg-secondary); padding: 2px 8px; border-radius: 6px; color: var(--text-tertiary); }
        .header-action { width: 40px; height: 40px; background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .header-action:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .notification-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .page-container { padding: 28px 32px; min-height: calc(100vh - var(--header-height)); }
        
        /* Notifications */
        .notification-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; }
        .notification {
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-width: 300px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.3s;
        }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .notification.success { border-left: 3px solid var(--success); }
        .notification.warning { border-left: 3px solid var(--warning); }
        .notification.error { border-left: 3px solid var(--danger); }
        .notification.info { border-left: 3px solid var(--accent-primary); }
        .notification-content { flex: 1; }
        .notification-title { font-size: 13px; font-weight: 600; }
        .notification-message { font-size: 11px; color: var(--text-tertiary); }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); transition: transform var(--transition-normal); z-index: 200; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-overlay { position: fixed; inset: 0; background: rgba(10,12,21,0.8); backdrop-filter: blur(4px); z-index: 150; display: none; }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0 !important; }
            .search-bar { display: none; }
            .page-container { padding: 20px; }
        }
        @media (max-width: 640px) {
            .app-header { padding: 0 16px; }
            .breadcrumb { display: none; }
        }
        
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border-medium); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-container">
            <div class="loading-logo"><span>NC</span></div>
            <div class="loading-title">Niche CRM</div>
            <div class="loading-sub">ENTERPRISE AGENCY OS</div>
            <div class="loading-spinner"></div>
            <div class="loading-progress"><div class="loading-progress-bar" id="loading-progress-bar"></div></div>
            <div class="loading-status" id="loading-status">Initialisation...</div>
        </div>
    </div>

    <div id="notification-container" class="notification-container"></div>
    <div id="root"></div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script>
        // ========================================
        // APP CORE
        // ========================================
        const AppCore = {
            state: { currentRoute: '/dashboard', isSidebarCollapsed: false, isMobileMenuOpen: false, user: null },
            
            routes: {
                '/dashboard': { title: 'Tableau de bord', icon: '📊', module: 'dashboard', file: 'dashboard.html' },
                '/people': { title: 'Personnes', icon: '👥', module: 'people', file: 'people.html' },
                '/pipeline': { title: 'Pipeline', icon: '⟶', module: 'pipeline', file: 'pipeline.html' },
                '/projects': { title: 'Projets', icon: '📁', module: 'projects', file: 'projects.html' },
                '/finance': { title: 'Finance', icon: '💰', module: 'finance', file: 'finance.html' },
                '/analytics': { title: 'Analytique', icon: '📈', module: 'analytics', file: 'analytics.html' },
                '/client-portal': { title: 'Portail client', icon: '🌐', module: 'client-portal', file: 'client-portal.html' },
                '/settings': { title: 'Paramètres', icon: '⚙️', module: 'settings', file: 'settings.html' }
            },
            
            navigationItems: [
                { section: 'PRINCIPAL', items: ['/dashboard', '/people', '/pipeline', '/projects', '/analytics'] },
                { section: 'CLIENT', items: ['/client-portal', '/finance'] },
                { section: 'SYSTÈME', items: ['/settings'] }
            ],
            
            session: null,
            
            async init() {
                this.loadSession();
                await this.render();
                this.handleRoute();
                window.addEventListener('hashchange', () => this.handleRoute());
                window.addEventListener('resize', () => this.handleResize());
                this.simulateLoading();
            },
            
            loadSession() {
                const saved = localStorage.getItem('crm_session');
                if (saved) { try { this.session = JSON.parse(saved); } catch(e) {} }
                if (!this.session) {
                    this.session = { id: 'admin_1', name: 'Administrateur', role: 'admin', roleLabel: 'Super Administrateur', avatar: 'AD' };
                    localStorage.setItem('crm_session', JSON.stringify(this.session));
                }
            },
            
            simulateLoading() {
                let progress = 0;
                const messages = ['Chargement du noyau...', 'Initialisation des modules...', 'Connexion à la base...', 'Préparation de l\'interface...', 'Finalisation...'];
                let idx = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        document.getElementById('loading-screen').classList.add('hide');
                        document.getElementById('root').classList.add('loaded');
                        setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 600);
                        this.showNotification('Bienvenue sur Niche CRM — Enterprise Agency OS', 'success');
                    }
                    const bar = document.getElementById('loading-progress-bar');
                    if (bar) bar.style.width = Math.min(progress, 100) + '%';
                    if (progress > (idx + 1) * 20 && idx < messages.length - 1) {
                        idx++;
                        const status = document.getElementById('loading-status');
                        if (status) status.textContent = messages[idx];
                    }
                }, 250);
            },
            
            showNotification(message, type = 'info', title = null) {
                const container = document.getElementById('notification-container');
                const icons = { success: '✅', warning: '⚠️', error: '❌', info: 'ℹ️' };
                const titles = { success: 'Succès', warning: 'Attention', error: 'Erreur', info: 'Information' };
                const notif = document.createElement('div');
                notif.className = `notification ${type}`;
                notif.innerHTML = `
                    <div class="notification-icon">${icons[type] || 'ℹ️'}</div>
                    <div class="notification-content">
                        <div class="notification-title">${title || titles[type]}</div>
                        <div class="notification-message">${message}</div>
                    </div>
                    <div class="notification-close" onclick="this.parentElement.remove()">✕</div>
                `;
                container.appendChild(notif);
                setTimeout(() => notif.remove(), 5000);
                return notif;
            },
            
            async render() {
                const root = document.getElementById('root');
                if (!root) return;
                const currentPath = window.location.hash.slice(1) || '/dashboard';
                const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
                this.state.isSidebarCollapsed = isCollapsed;
                
                let sidebarHtml = `<aside class="sidebar ${isCollapsed ? 'collapsed' : ''}" id="sidebar">`;
                sidebarHtml += `<div class="sidebar-header"><div class="sidebar-logo"><span>NC</span></div>`;
                if (!isCollapsed) sidebarHtml += `<div><div class="sidebar-logo-text">Niche CRM</div><div class="sidebar-logo-version">Enterprise OS v2.0</div></div>`;
                sidebarHtml += `</div><nav class="sidebar-nav">`;
                
                for (const section of this.navigationItems) {
                    if (!isCollapsed) sidebarHtml += `<div class="nav-section-title">${section.section}</div>`;
                    for (const path of section.items) {
                        const route = this.routes[path];
                        if (!route) continue;
                        const isActive = currentPath === path;
                        sidebarHtml += `<a href="#${path}" class="nav-item ${isActive ? 'active' : ''}">
                            <span class="nav-icon">${route.icon}</span>
                            ${!isCollapsed ? `<span class="nav-label">${route.title}</span>` : ''}
                        </a>`;
                    }
                }
                
                sidebarHtml += `</nav><div class="sidebar-footer">
                    <div class="user-avatar">${this.session.avatar}</div>
                    ${!isCollapsed ? `<div class="user-info"><div class="user-name">${this.session.name}</div><div class="user-role">${this.session.roleLabel}</div></div>
                    <div class="logout-btn" onclick="AppCore.logout()">🚪</div>` : ''}
                </div></aside>`;
                
                sidebarHtml += `<main class="main-content">
                    <header class="app-header">
                        <div class="header-left">
                            <div class="menu-toggle" id="menu-toggle"><span>☰</span></div>
                            <div class="breadcrumb">Navigation / <strong id="breadcrumb-title">Tableau de bord</strong></div>
                        </div>
                        <div class="header-right">
                            <div class="search-bar"><span>🔍</span><input type="text" id="global-search" placeholder="Rechercher..."><span class="search-kbd">⌘K</span></div>
                            <div class="header-action" id="notifications-btn"><span>🔔</span><span class="notification-dot"></span></div>
                        </div>
                    </header>
                    <div class="page-container" id="page-container"><div class="spinner"></div></div>
                </main>`;
                
                root.innerHTML = sidebarHtml;
                
                document.getElementById('menu-toggle')?.addEventListener('click', () => this.toggleSidebar());
                document.getElementById('global-search')?.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); this.showNotification('Recherche globale — Fonctionnalité à venir', 'info'); } });
                document.getElementById('notifications-btn')?.addEventListener('click', () => this.showNotification('3 nouvelles notifications non lues', 'info', 'Notifications'));
            },
            
            async handleRoute() {
                const hash = window.location.hash.slice(1) || '/dashboard';
                const route = this.routes[hash] || this.routes['/dashboard'];
                const container = document.getElementById('page-container');
                const breadcrumb = document.getElementById('breadcrumb-title');
                if (breadcrumb) breadcrumb.textContent = route.title;
                
                document.querySelectorAll('.nav-item').forEach(item => {
                    const href = item.getAttribute('href');
                    if (href === `#${hash}`) item.classList.add('active');
                    else item.classList.remove('active');
                });
                
                if (!container) return;
                container.innerHTML = `<div style="display:flex;justify-content:center;min-height:400px;"><div class="spinner"></div></div>`;
                
                try {
                    // Charger le module HTML
                    const response = await fetch(route.file);
                    const html = await response.text();
                    // Extraire le contenu de la page (entre <body> ou contenu principal)
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const moduleContent = doc.querySelector('.module-content') || doc.body;
                    container.innerHTML = moduleContent.innerHTML;
                    
                    // Charger le CSS spécifique si existe
                    const existingLink = document.querySelector('link[data-module="' + route.module + '"]');
                    if (existingLink) existingLink.remove();
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = `${route.module}.css`;
                    link.setAttribute('data-module', route.module);
                    document.head.appendChild(link);
                    
                    // Exécuter le script du module
                    const script = document.createElement('script');
                    script.src = `${route.module}.js`;
                    script.onload = () => { if (window[`init${route.module.charAt(0).toUpperCase() + route.module.slice(1)}`]) window[`init${route.module.charAt(0).toUpperCase() + route.module.slice(1)}`](); };
                    document.body.appendChild(script);
                    
                } catch (error) {
                    console.error('Erreur chargement module:', error);
                    container.innerHTML = `<div style="text-align:center;padding:80px"><div style="font-size:64px">${route.icon}</div>
                        <h2 style="margin:20px 0">${route.title}</h2>
                        <p style="color:var(--text-tertiary)">Module en cours de développement</p>
                        <div class="glass-card" style="max-width:500px;margin:24px auto;padding:24px">
                            Ce module sera bientôt disponible avec toutes les fonctionnalités dynamiques.
                        </div></div>`;
                }
            },
            
            toggleSidebar() {
                this.state.isSidebarCollapsed = !this.state.isSidebarCollapsed;
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.toggle('collapsed', this.state.isSidebarCollapsed);
                localStorage.setItem('sidebar_collapsed', this.state.isSidebarCollapsed);
            },
            
            handleResize() {
                if (window.innerWidth > 1024) {
                    document.getElementById('sidebar')?.classList.remove('mobile-open');
                    document.getElementById('sidebar-overlay')?.classList.remove('active');
                    this.state.isMobileMenuOpen = false;
                }
            },
            
            logout() {
                localStorage.removeItem('crm_session');
                this.showNotification('Déconnexion réussie', 'success');
                setTimeout(() => window.location.href = 'login.html', 1000);
            }
        };
        
        window.AppCore = AppCore;
        AppCore.init();
    </script>
</body>
</html>
