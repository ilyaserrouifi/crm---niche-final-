<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Niche CRM — Projects</title>
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b7ef8'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-weight='bold' font-family='Arial'%3ENC%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04091a;--bg2:#070f24;--surface:#0b152e;--surface2:#111d3f;--surface3:#162248;
  --border:#1c2d55;--border2:#243460;
  --accent:#3b7ef8;--teal:#22d3b8;--amber:#f59e0b;--red:#f43f5e;--green:#10b981;--purple:#8b5cf6;
  --text:#e2e8f8;--text2:#8da0c4;--text3:#4e637a;
  --head:'Space Grotesk',sans-serif;--body:'Plus Jakarta Sans',sans-serif;
  --sw:240px;--radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;min-height:100vh;display:flex;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
a{text-decoration:none;color:inherit}
button{cursor:pointer}

.sidebar{width:var(--sw);min-height:100vh;background:linear-gradient(180deg,var(--surface) 0%,var(--bg2) 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:200}
.logo-wrap{padding:22px 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:14px;color:#fff}
.logo-text{font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:-.3px}
.logo-ver{font-size:10px;color:var(--text3);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-section{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);padding:10px 20px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 18px;margin:1px 8px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--text2);transition:all .15s;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(59,126,248,.18),rgba(59,126,248,.06));color:var(--accent);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:22%;height:56%;width:2.5px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-ic{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.profile-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b7ef8,#22d3b8);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:13px;font-weight:700;color:#fff}
.profile-name{font-size:13px;font-weight:600}
.profile-role{font-size:11px;color:var(--text3)}
.profile-menu{margin-left:auto;width:26px;height:26px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}

.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:100}
.breadcrumb{flex:1;font-size:13px;color:var(--text2)}
.breadcrumb strong{color:var(--text)}
.search{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 13px;width:230px}
.search input{background:none;border:none;outline:none;font-family:var(--body);font-size:13px;color:var(--text);width:100%}
.search input::placeholder{color:var(--text3)}
.kbd{font-size:11px;background:var(--surface3);border:1px solid var(--border);padding:1px 6px;border-radius:4px;color:var(--text3)}
.tb-btn{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text2)}
.btn-primary{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{opacity:.88}
.btn-ghost{display:flex;align-items:center;gap:6px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:12px}
.content{padding:26px 28px;flex:1}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.page-title{font-family:var(--head);font-size:22px;font-weight:700}
.page-sub{font-size:13px;color:var(--text3);margin-top:4px}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-bottom:8px}
.stat-val{font-family:var(--head);font-size:24px;font-weight:700}

.tabs{display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;width:fit-content;margin-bottom:22px}
.tab{padding:9px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s}
.tab.active{background:var(--accent);color:#fff}

.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .18s}
.project-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.proj-header{display:flex;justify-content:space-between;margin-bottom:12px}
.proj-name{font-family:var(--head);font-size:15px;font-weight:700}
.proj-client{font-size:12px;color:var(--text3);margin-top:3px}
.progress-bar{height:5px;background:var(--surface2);border-radius:3px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px}
.proj-meta{display:flex;gap:12px;margin:10px 0;font-size:11px;color:var(--text3)}
.proj-footer{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}

.task-table{width:100%;border-collapse:collapse}
.task-table th{padding:10px;text-align:left;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border)}
.task-table td{padding:10px;font-size:13px;border-bottom:1px solid rgba(28,45,85,.4)}
.chip{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.chip.blue{background:rgba(59,126,248,.1);color:var(--accent)}
.chip.green{background:rgba(16,185,129,.1);color:var(--green)}
.chip.yellow{background:rgba(245,158,11,.1);color:var(--amber)}
.chip.red{background:rgba(244,63,94,.1);color:var(--red)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,9,26,.85);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:600px;max-width:95vw;padding:28px;position:relative}
.modal-title{font-family:var(--head);font-size:18px;font-weight:700}
.modal-close{position:absolute;top:20px;right:20px;width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--body);font-size:13px;color:var(--text);outline:none}
.form-input:focus{border-color:var(--accent)}
.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--body);font-size:13px;color:var(--text)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
.empty-state{text-align:center;padding:40px;color:var(--text3)}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo-wrap"><div class="logo-icon">NC</div><div><div class="logo-text">Niche CRM</div><div class="logo-ver">Agency OS v1.0</div></div></div>
  <nav class="nav">
    <div><div class="nav-section">Main</div>
      <a class="nav-item" href="index.html"><span class="nav-ic">⊞</span> Dashboard</a>
      <a class="nav-item" href="people.html"><span class="nav-ic">👥</span> People</a>
      <a class="nav-item" href="pipeline.html"><span class="nav-ic">⟶</span> Pipeline</a>
      <a class="nav-item active" href="projects.html"><span class="nav-ic">📁</span> Projects</a>
      <a class="nav-item" href="analytics.html"><span class="nav-ic">📊</span> Analytics</a>
    </div>
    <div><div class="nav-section">Client</div>
      <a class="nav-item" href="client-portal.html"><span class="nav-ic">🌐</span> Client Portal</a>
      <a class="nav-item" href="finance.html"><span class="nav-ic">💰</span> Finance</a>
    </div>
    <div><div class="nav-section">System</div>
      <a class="nav-item" href="#"><span class="nav-ic">⚙️</span> Settings</a>
    </div>
  </nav>
  <div class="sidebar-footer"><div class="profile-av">AN</div><div><div class="profile-name">Admin</div><div class="profile-role">Super Admin</div></div><div class="profile-menu">···</div></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb">Work / <strong>Projects</strong></div>
    <div class="search"><span>🔍</span><input type="text" id="search-input" placeholder="Search projects..."/><span class="kbd">⌘K</span></div>
    <div style="display:flex;gap:7px"><div class="tb-btn">🔔</div><div class="tb-btn">✉️</div></div>
    <button class="btn-primary" onclick="openAddProject()">+ New Project</button>
  </header>

  <main class="content">
    <div class="page-header"><div><div class="page-title">Projects</div><div class="page-sub" id="page-sub">0 projects</div></div></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="tabs"><div class="tab active" onclick="switchView('cards')">📋 Cards</div><div class="tab" onclick="switchView('tasks')">✅ Tasks</div><div class="tab" onclick="switchView('gantt')">📅 Gantt</div></div>
    <div id="cards-view"><div class="projects-grid" id="projects-grid"></div></div>
    <div id="tasks-view" style="display:none"><div id="tasks-container"></div></div>
    <div id="gantt-view" style="display:none"><div id="gantt-container"></div></div>
  </main>
</div>

<!-- Project Modal -->
<div class="modal-overlay" id="project-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-close" onclick="closeModal()">✕</div>
    <div class="modal-title" id="modal-title">New Project</div>
    <input type="hidden" id="edit-proj-id"/>
    <div class="form-row-2"><div class="form-group"><label class="form-label">Project Name *</label><input class="form-input" id="p-name"/></div>
    <div class="form-group"><label class="form-label">Client</label><input class="form-input" id="p-client"/></div></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="p-desc" rows="2"></textarea></div>
    <div class="form-row-2"><div class="form-group"><label class="form-label">Start Date</label><input class="form-input" id="p-start" type="date"/></div>
    <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" id="p-due" type="date"/></div></div>
    <div class="form-row-2"><div class="form-group"><label class="form-label">Budget ($)</label><input class="form-input" id="p-budget" type="number"/></div>
    <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="p-status"><option>Active</option><option>Paused</option><option>Completed</option></select></div></div>
    <div class="form-actions"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveProject()">Save</button></div>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal" onclick="if(event.target===this)closeTaskModal()">
  <div class="modal"><div class="modal-close" onclick="closeTaskModal()">✕</div>
    <div class="modal-title">Add Task</div>
    <input type="hidden" id="task-proj-id"/>
    <div class="form-group"><label class="form-label">Task Name *</label><input class="form-input" id="t-name"/></div>
    <div class="form-row-2"><div class="form-group"><label class="form-label">Assigned To</label><input class="form-input" id="t-assigned"/></div>
    <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" id="t-due" type="date"/></div></div>
    <div class="form-row-2"><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="t-priority"><option>Low</option><option>Medium</option><option>High</option></select></div>
    <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="t-status"><option>To Do</option><option>In Progress</option><option>Review</option><option>Done</option></select></div></div>
    <div class="form-actions"><button class="btn-ghost" onclick="closeTaskModal()">Cancel</button><button class="btn-primary" onclick="saveTask()">Add Task</button></div>
  </div>
</div>

<script>
let projects = JSON.parse(localStorage.getItem('crm_projects') || '[]');
let tasks = JSON.parse(localStorage.getItem('crm_tasks') || '[]');
let currentView = 'cards';
let searchQuery = '';

function saveAll() { localStorage.setItem('crm_projects', JSON.stringify(projects)); localStorage.setItem('crm_tasks', JSON.stringify(tasks)); }

function updateStats() {
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Projects</div><div class="stat-val">${projects.length}</div></div>
    <div class="stat-card"><div class="stat-label">Active</div><div class="stat-val" style="color:var(--accent)">${projects.filter(p=>p.status==='Active').length}</div></div>
    <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-val" style="color:var(--green)">${projects.filter(p=>p.status==='Completed').length}</div></div>
    <div class="stat-card"><div class="stat-label">Tasks</div><div class="stat-val">${tasks.length}</div></div>`;
  document.getElementById('page-sub').innerHTML = `${projects.length} projects · ${tasks.length} tasks`;
}

function renderCards() {
  const grid = document.getElementById('projects-grid');
  let filtered = projects.filter(p => !searchQuery || p.name?.toLowerCase().includes(searchQuery) || p.client?.toLowerCase().includes(searchQuery));
  if(!filtered.length) { grid.innerHTML = '<div class="empty-state">📁 No projects yet. Click + New Project</div>'; return; }
  grid.innerHTML = filtered.map(p => {
    const projTasks = tasks.filter(t=>t.projectId===p.id);
    const done = projTasks.filter(t=>t.status==='Done').length;
    const pct = projTasks.length ? Math.round(done/projTasks.length*100) : 0;
    return `<div class="project-card" onclick="openProjectDetail('${p.id}')">
      <div class="proj-header"><div><div class="proj-name">${p.name}</div><div class="proj-client">👤 ${p.client || '—'}</div></div>
      <span class="chip ${p.status==='Active'?'blue':p.status==='Completed'?'green':'yellow'}">${p.status}</span></div>
      ${p.desc?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${p.desc}</div>`:''}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      <div class="proj-meta"><span>💰 $${(p.budget||0).toLocaleString()}</span><span>📅 Due: ${p.due||'—'}</span><span>✅ ${done}/${projTasks.length}</span></div>
      <div class="proj-footer"><button class="btn-ghost btn-sm" onclick="event.stopPropagation();editProject('${p.id}')">✏️ Edit</button>
      <button class="btn-ghost btn-sm" style="color:var(--red)" onclick="event.stopPropagation();deleteProject('${p.id}')">🗑 Delete</button></div>
    </div>`;
  }).join('');
}

function renderTasks() {
  const container = document.getElementById('tasks-container');
  let filtered = tasks.filter(t => !searchQuery || t.name?.toLowerCase().includes(searchQuery));
  if(!filtered.length) { container.innerHTML = '<div class="empty-state">✅ No tasks yet. Add tasks to projects</div>'; return; }
  container.innerHTML = `<table class="task-table"><thead><tr><th>Task</th><th>Project</th><th>Assigned</th><th>Priority</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>
    ${filtered.map(t => { const proj = projects.find(p=>p.id===t.projectId);
      return `<tr><td style="font-weight:600">${t.name}</td><td>${proj?.name||'—'}</td><td>${t.assigned||'—'}</td>
      <td><span class="chip ${t.priority==='High'?'red':t.priority==='Medium'?'yellow':'blue'}">${t.priority}</span></td>
      <td><span class="chip ${t.status==='Done'?'green':t.status==='In Progress'?'blue':'yellow'}">${t.status}</span></td>
      <td>${t.due||'—'}</td>
      <td><button class="btn-ghost btn-sm" onclick="deleteTask('${t.id}')">🗑</button></td></tr>`;
    }).join('')}</tbody></table>`;
}

function renderGantt() {
  const container = document.getElementById('gantt-container');
  if(!projects.length) { container.innerHTML = '<div class="empty-state">📅 No projects with dates</div>'; return; }
  container.innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="width:200px">Project</th><th>Timeline</th></tr></thead><tbody>
    ${projects.map(p => `<tr><td style="padding:10px;border-bottom:1px solid var(--border)"><strong>${p.name}</strong><br><span style="font-size:11px;color:var(--text3)">${p.start||'—'} → ${p.due||'—'}</span></td>
    <td style="padding:10px;border-bottom:1px solid var(--border)"><div style="height:24px;background:var(--surface2);border-radius:4px;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,Math.random()*100)}%;background:var(--accent);border-radius:4px"></div></div></td></tr>`).join('')}
  </tbody></table></div>`;
}

function switchView(view) { currentView = view; document.getElementById('cards-view').style.display = view==='cards'?'block':'none'; document.getElementById('tasks-view').style.display = view==='tasks'?'block':'none'; document.getElementById('gantt-view').style.display = view==='gantt'?'block':'none'; renderAll(); }

function openAddProject() { document.getElementById('modal-title').innerText = 'New Project'; document.getElementById('edit-proj-id').value = ''; ['p-name','p-client','p-desc','p-start','p-due','p-budget'].forEach(id=>document.getElementById(id).value=''); document.getElementById('p-status').value='Active'; document.getElementById('project-modal').classList.add('open'); }
function editProject(id) { const p = projects.find(x=>x.id===id); if(!p)return; document.getElementById('modal-title').innerText = 'Edit Project'; document.getElementById('edit-proj-id').value = id; document.getElementById('p-name').value = p.name||''; document.getElementById('p-client').value = p.client||''; document.getElementById('p-desc').value = p.desc||''; document.getElementById('p-start').value = p.start||''; document.getElementById('p-due').value = p.due||''; document.getElementById('p-budget').value = p.budget||''; document.getElementById('p-status').value = p.status||'Active'; document.getElementById('project-modal').classList.add('open'); }
function saveProject() { const id = document.getElementById('edit-proj-id').value; const data = { name:document.getElementById('p-name').value, client:document.getElementById('p-client').value, desc:document.getElementById('p-desc').value, start:document.getElementById('p-start').value, due:document.getElementById('p-due').value, budget:parseFloat(document.getElementById('p-budget').value)||0, status:document.getElementById('p-status').value }; if(!data.name) return alert('Project name required'); if(id) { const idx = projects.findIndex(p=>p.id===id); if(idx!==-1) projects[idx] = {...projects[idx], ...data}; } else projects.push({ id:Date.now().toString(), ...data, createdAt:new Date().toISOString() }); saveAll(); closeModal(); renderAll(); }
function deleteProject(id) { if(confirm('Delete project and all tasks?')) { projects = projects.filter(p=>p.id!==id); tasks = tasks.filter(t=>t.projectId!==id); saveAll(); renderAll(); } }
function openTaskForProject(projId) { document.getElementById('task-proj-id').value = projId; document.getElementById('t-name').value = ''; document.getElementById('t-assigned').value = ''; document.getElementById('t-due').value = ''; document.getElementById('t-priority').value = 'Medium'; document.getElementById('t-status').value = 'To Do'; document.getElementById('task-modal').classList.add('open'); }
function saveTask() { const projId = document.getElementById('task-proj-id').value; const name = document.getElementById('t-name').value.trim(); if(!name) return alert('Task name required'); tasks.push({ id:Date.now().toString(), projectId:projId, name, assigned:document.getElementById('t-assigned').value, due:document.getElementById('t-due').value, priority:document.getElementById('t-priority').value, status:document.getElementById('t-status').value, createdAt:new Date().toISOString() }); saveAll(); closeTaskModal(); renderAll(); }
function deleteTask(id) { tasks = tasks.filter(t=>t.id!==id); saveAll(); renderAll(); }
function openProjectDetail(id) { const p = projects.find(x=>x.id===id); if(!p) return; const projTasks = tasks.filter(t=>t.projectId===id); alert(`📁 ${p.name}\nClient: ${p.client||'—'}\nBudget: $${(p.budget||0).toLocaleString()}\nStatus: ${p.status}\nTasks: ${projTasks.length}\nDue: ${p.due||'—'}`); }
function closeModal() { document.getElementById('project-modal').classList.remove('open'); }
function closeTaskModal() { document.getElementById('task-modal').classList.remove('open'); }
function handleSearch(val) { searchQuery = val.toLowerCase(); renderAll(); }
function renderAll() { updateStats(); renderCards(); renderTasks(); renderGantt(); }

document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));
renderAll();
</script>
</body>
</html>
